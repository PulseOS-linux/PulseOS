# Enable Powerlevel10k instant prompt. Should stay close to the top of ~/.zshrc.
if [[ -r "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh" ]]; then
  source "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh"
fi

# Path to your Oh My Zsh installation.
export ZSH="$HOME/.oh-my-zsh"

# === zsh-startcache: ОБЯЗАТЕЛЬНО до Oh My Zsh ===
# (перехватывает compinit, кеширует инициализацию)
if [[ -f ${ZSH_CUSTOM:-~/.oh-my-zsh/custom}/plugins/zsh-startcache/zsh-startcache.plugin.zsh ]]; then
  source ${ZSH_CUSTOM:-~/.oh-my-zsh/custom}/plugins/zsh-startcache/zsh-startcache.plugin.zsh
fi

# === Oh My Zsh ===
# Тема отключена: p10k грузится через Zinit.
ZSH_THEME=""

# Внешние плагины (syntax-highlighting, autosuggestions) грузятся через Zinit ниже,
# поэтому в plugins= оставляем только встроенный git.
plugins=(git)

source $ZSH/oh-my-zsh.sh

# === Zinit ===
# Автоустановка, если ещё нет
if [[ ! -f $HOME/.local/share/zinit/zinit.git/zinit.zsh ]]; then
    print -P "%F{33} %F{220}Installing %F{33}ZDHARMA-CONTINUUM%F{220} Initiative Plugin Manager (%F{33}zdharma-continuum/zinit%F{220})…%f"
    command mkdir -p "$HOME/.local/share/zinit" && command chmod g-rwX "$HOME/.local/share/zinit"
    command git clone https://github.com/zdharma-continuum/zinit "$HOME/.local/share/zinit/zinit.git" && \
        print -P "%F{33} %F{34}Installation successful.%f%b" || \
        print -P "%F{160} The clone has failed.%f%b"
fi

source "$HOME/.local/share/zinit/zinit.git/zinit.zsh"
autoload -Uz _zinit
(( ${+_comps} )) && _comps[zinit]=_zinit

# Annexes
zinit light-mode for \
    zdharma-continuum/zinit-annex-as-monitor \
    zdharma-continuum/zinit-annex-bin-gem-node \
    zdharma-continuum/zinit-annex-patch-dl \
    zdharma-continuum/zinit-annex-rust

# Powerlevel10k (тема)
zinit ice depth=1
zinit light romkatv/powerlevel10k

# Внешние плагины
zinit light zsh-users/zsh-syntax-highlighting
zinit light zsh-users/zsh-autosuggestions

# === User configuration ===
# export MANPATH="/usr/local/man:$MANPATH"
# export LANG=en_US.UTF-8
# export EDITOR='vim'

# ===== История команд =====
HISTFILE=~/.zsh_history
HISTSIZE=50000
SAVEHIST=50000
setopt SHARE_HISTORY
setopt HIST_IGNORE_DUPS
setopt HIST_IGNORE_SPACE
setopt HIST_REDUCE_BLANKS
setopt INC_APPEND_HISTORY

# ===== Коррекция путей и команд =====
setopt CORRECT
setopt CORRECT_ALL
setopt AUTO_CD
setopt COMPLETE_IN_WORD
setopt ALWAYS_TO_END

# ===== Улучшенное автодополнение путей =====
zstyle ':completion:*' matcher-list 'm:{a-zA-Z}={A-Za-z}' 'r:|[._-]=* r:|=*' 'l:|=* r:|=*'
zstyle ':completion:*' list-colors "${(s.:.)LS_COLORS}"
zstyle ':completion:*' menu select
zstyle ':completion:*:paths' accept-exact '*(N)'

# ===== p10k конфиг (в самом конце, после загрузки темы) =====
[[ ! -f ~/.p10k.zsh ]] || source ~/.p10k.zsh
